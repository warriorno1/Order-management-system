name: Order Status Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler endpoint
        run: |
          curl -X POST "${{ secrets.SCHEDULER_URL }}" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}"